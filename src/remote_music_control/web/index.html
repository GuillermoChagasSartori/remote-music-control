<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this, phones render the page at desktop width and shrink it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells the browser the page supports both themes (form controls, scrollbars). -->
  <meta name="color-scheme" content="light dark">
  <title>Music</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- `defer`: download in parallel, run after the HTML is parsed, so the
       script can find every element by id. -->
  <script src="/static/app.js" defer></script>
</head>
<body>
  <!-- data-status drives which icons and styles show; app.js keeps it updated.
       "connecting" | "playing" | "paused" | "stopped" | "none" (no player open)
       | "locked" (no valid token yet) -->
  <!-- data-view: which panel is shown — "player", "search" or "queue". -->
  <main id="player" class="player" data-status="connecting" data-view="player">

    <p id="banner" class="banner" role="alert" hidden></p>

    <!-- View switcher. aria-pressed tells assistive technology which is active. -->
    <nav class="views" aria-label="Views">
      <button type="button" class="view-tab" data-view-target="player" aria-pressed="true">Player</button>
      <button type="button" class="view-tab" data-view-target="search" aria-pressed="false">Search</button>
      <button type="button" class="view-tab" data-view-target="queue" aria-pressed="false">Queue</button>
    </nav>

    <!-- Shown instead of the controls when there is no token or it was rejected. -->
    <form id="token-form" class="token-form" hidden>
      <label for="token-input">Access token</label>
      <p class="hint">Paste the token from the server's config file (created by <code>music-server init</code>).</p>
      <!-- type=password: the token isn't shown on screen or offered by autocomplete. -->
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">Connect</button>
    </form>

    <!-- aria-live: screen readers announce track changes without focus moving. -->
    <section class="track" aria-live="polite">
      <p id="status" class="status">Connecting…</p>
      <h1 id="title" class="title">&nbsp;</h1>
      <p id="artist" class="artist">&nbsp;</p>
      <p id="album" class="album">&nbsp;</p>
    </section>

    <section class="transport" aria-label="Playback">
      <button type="button" class="control" data-path="/api/previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
      </button>
      <button type="button" class="control primary" data-path="/api/play-pause" aria-label="Play or pause">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button type="button" class="control" data-path="/api/next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </section>

    <section class="volume" aria-label="Volume">
      <!-- Two rows: the slider gets the full width (it needs room to be
           usable on a phone); the buttons sit centered underneath. -->
      <div class="volume-slider">
        <input id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Volume level">
        <output id="volume-value" for="volume" class="volume-value">–</output>
      </div>
      <div class="volume-buttons">
        <button type="button" class="control small" data-volume-path="/api/volume/down" aria-label="Volume down">−</button>
        <button type="button" id="mute" class="control small" aria-label="Mute" aria-pressed="false">
          <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm12.6-.4 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>
        </button>
        <button type="button" class="control small" data-volume-path="/api/volume/up" aria-label="Volume up">+</button>
      </div>
    </section>

    <!-- Search and queue come from YouTube Music through the Chrome extension. -->
    <section class="panel search-panel" aria-label="Search">
      <form id="search-form" class="search-form" role="search">
        <input id="search-input" type="search" placeholder="Search YouTube Music" autocomplete="off" required>
        <button type="submit">Search</button>
      </form>
      <p class="library-message" hidden></p>
      <ul id="search-results" class="song-list"></ul>
    </section>

    <section class="panel queue-panel" aria-label="Queue">
      <p class="library-message" hidden></p>
      <ol id="queue-list" class="song-list"></ol>
    </section>

  </main>
</body>
</html>
