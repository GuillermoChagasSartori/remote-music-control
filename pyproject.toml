[project]
name = "remote-music-control"
version = "0.9.0"
description = "Control YouTube Music playing on a Windows PC from any browser or terminal on the same LAN."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Chagas Sartori" }]
requires-python = ">=3.12"
# Each dependency is added in the phase that needs it, with a one-line reason.
dependencies = [
    "fastapi>=0.141.1",  # HTTP framework: routing, validation, auto-generated API docs
    "httpx2>=2.12.0",    # HTTP client for the CLI; same library as FastAPI's test client (docs/decisions/0010)
    "uvicorn>=0.52.4",   # ASGI server that actually listens on the socket and runs the app
    "segno>=1.6.6",      # QR codes for the pairing page, as SVG; pure Python, no dependencies
    # Network card MAC address for the pairing page (all systems); on Windows also names
    # the process behind each audio session.
    "psutil>=7.2.2",
    # --- Windows only: the `; sys_platform == 'win32'` marker makes Linux skip them ---
    # SMTC (play/pause/skip, now-playing) through pywinrt; see docs/decisions/0002.
    # pywinrt ships one package per WinRT namespace, so each namespace we touch is listed.
    "winrt-runtime>=3.2.1 ; sys_platform == 'win32'",                         # core runtime all namespaces need
    "winrt-windows-media-control>=3.2.1 ; sys_platform == 'win32'",           # the SMTC session manager
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",              # async operation types it returns
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",  # the list of sessions
    # Per-application volume through the Windows Core Audio API (SMTC has no volume control).
    "pycaw>=20251023 ; sys_platform == 'win32'",
    # The app (ADR 0014):
    "pywebview>=6.2.1 ; sys_platform == 'win32'",  # the window showing YouTube Music, through WebView2
    "pystray>=0.19.5 ; sys_platform == 'win32'",   # the tray icon and its menu
    "pillow>=12.3.0 ; sys_platform == 'win32'",    # loads the icon image for pystray (which requires it)
]

# Console scripts: `uv sync` installs these as commands inside .venv.
[project.scripts]
music = "remote_music_control.cli:main"
music-server = "remote_music_control.server:main"

# GUI scripts are like console scripts, but on Windows their launcher opens no
# console window — right for an app that has its own window.
[project.gui-scripts]
remote-music-control = "remote_music_control.app.main:main"

[build-system]
# uv's own build backend: it turns src/remote_music_control into an
# installable package with zero configuration, which is all we need.
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

# Development-only tools: installed by `uv sync`, not needed to run the app.
[dependency-groups]
dev = [
    "pytest>=9.1.1",      # test runner: plain `assert`, fixtures, clear failure output
    "pytest-cov>=7.1.0",  # coverage report: which lines the tests never execute
]
# Tools for building the Windows installer (packaging/build.ps1): `uv sync --group build`.
build = [
    "pyinstaller>=6.22.3 ; sys_platform == 'win32'",  # bundles Python and the app into a folder that runs without Python installed
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--cov` measures coverage of our package; `term-missing` lists untested lines.
addopts = "--cov=remote_music_control --cov-report=term-missing"
# Turn warnings into test failures, so deprecations are noticed when they
# appear instead of piling up unread.
filterwarnings = [
    "error",
    # Third-party, not our code: starlette's test client still uses an anyio
    # name that anyio deprecated. Ignored by exact message so any *other*
    # warning still fails. Remove once starlette is updated.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# Windows-only code can't run on Linux CI (see docs/testing-on-windows.md);
# excluding it keeps the coverage number about code the tests can reach. The
# app's testable parts (page, texts, window actions, background server) are
# in separate modules so they stay measured.
omit = [
    "*/adapters/windows.py",
    "*/app/main.py",
    "*/app/single_instance.py",
    "*/app/tray.py",
]

[tool.coverage.report]
# Script entry points only run when a file is executed directly.
exclude_also = ['if __name__ == "__main__":']
